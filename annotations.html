<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>絲庵 文化譜書き込み</title>
  <style>
    :root{--ink:#332c25;--blue:#477d91;--pale:#e9f3f5;--yellow:#f5df84;--paper:#fffef9}
    *{box-sizing:border-box}body{margin:0;background:#e5ded3;color:var(--ink);font-family:"Yu Gothic",sans-serif}
    button,input{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:14px}main.app{display:flex;flex-direction:column}
    .head{display:flex;justify-content:space-between;align-items:end;gap:10px}h1{margin:0;font:600 27px serif}
    .brand{margin:0;color:var(--blue);font:13px serif;letter-spacing:.12em}.actions{display:flex;flex-wrap:wrap;gap:6px}
    .actions button,.move button,.layout-controls button{min-height:42px;border:1px solid #bcae9e;border-radius:9px;background:#fff;padding:8px 12px}
    .paper{position:relative;margin-top:12px;padding:24px 22px 34px;background:var(--paper);border:1px solid #cabfaf;box-shadow:0 8px 25px #46331d1c;overflow:hidden}
    .paper.preview-mode .score-scroll{overflow:hidden}
    .paper.preview-mode .score{width:100%;min-width:0}
    .paper.preview-mode .measure{min-width:0;width:auto;flex:var(--measure-grow,384) 1 0}
    .paper.preview-mode .string{grid-template-columns:repeat(16,minmax(0,1fr))}
    .paper.annotating{touch-action:none}.annotation-svg{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}.paper.annotating .annotation-svg{pointer-events:auto}
    .annotation-svg text{font-family:"Yu Gothic","Noto Sans JP",sans-serif;font-stretch:normal}.annotation-item{pointer-events:stroke}.annotation-item.text-item{pointer-events:all}.annotation-item.selected{filter:drop-shadow(0 0 4px #f2c500)}
    .meta{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:end;font:15px serif}.score-meta{display:flex;align-items:flex-end;gap:6px}.score-meta select,.score-meta input{border:0;background:transparent;font:15px serif;padding:4px}.score-meta input{width:9em;text-align:left}.meta span:last-child{text-align:right}
    .meta input{border:0;background:none;text-align:center;font:28px serif;min-width:0}.score-meta #meter{font-size:15px}.meta #title{justify-self:center;width:8em;max-width:100%;box-sizing:border-box;border-bottom:1px solid #333;padding:4px 1em}
    .staff{margin-top:28px}
    .score-wrap{display:grid;grid-template-columns:55px minmax(0,1fr)}.labels{display:grid;grid-template-rows:repeat(3,34px);font:12px/34px serif;text-align:right;padding-right:7px}
    .score-scroll{min-width:0;overflow-x:auto;overflow-y:hidden}
    .score{display:flex;width:max-content;min-width:100%}.measure{--row-height:34px;display:grid;grid-template-rows:repeat(3,var(--row-height));flex:0 0 var(--measure-width,384px);width:var(--measure-width,384px);min-width:240px;border-left:0;position:relative}
    .measure::before,.measure:last-child::after{content:"";position:absolute;z-index:6;top:calc(var(--row-height)/2);bottom:calc(var(--row-height)/2);border-left:1.5px solid var(--ink)}.measure::before{left:0}.measure:last-child::after{right:0}.measure.on{background:#fff9dd}.string{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));position:relative}
    .string::before{content:"";position:absolute;z-index:0;left:0;right:0;top:50%;border-top:1px solid var(--ink);pointer-events:none}
    .cell{border:0;background:none;padding:0;min-width:0}.cell:nth-child(4n){border-right:1px solid #477d9120}.cell.cursor{background:var(--yellow);box-shadow:inset 0 0 0 2px #c9a927}
    .note{z-index:2;align-self:center;justify-self:center;width:max-content;height:32px;border:0;background:none;padding:0;cursor:pointer;overflow:visible}.note b{display:inline-block;min-width:20px;background:var(--paper);padding:0 2px 2px;font:600 25px/29px Arial;text-align:center;white-space:nowrap;color:var(--note-color,#222)}
    .measure.on .note b{background:#fff9dd}.note.d2::after,.note.d1::after{content:"";position:absolute;left:50%;width:18px;transform:translateX(-50%);border-top:2px solid currentColor;bottom:0}.note.d1::after{height:5px;border-bottom:2px solid currentColor}.note{position:relative}.note.rest b,.note.rest.d4 b,.note.rest.d2 b,.note.rest.d1 b{font-family:Arial,sans-serif;font-size:20px;line-height:25px}
    .panel{margin-top:14px;padding:16px;background:#fffcf7;border:1px solid #c9bcad;border-radius:15px}.layout-bar{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #ddd2c5}
    .layout-controls{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.layout-controls strong{min-width:82px;text-align:center}.layout-controls button[aria-label]{width:42px;padding:6px;font-size:20px}
    .status{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pale);padding:10px;border-radius:10px}.status strong{display:block;color:#285366}
    .move{display:flex;gap:5px}.move .del{color:#9d4036}.controls{display:grid;grid-template-columns:1fr 1.3fr;gap:14px;margin-top:14px}fieldset{border:0;padding:0;margin:0}legend{font-size:13px;font-weight:bold;color:#74695e;margin-bottom:7px}
    .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg button{min-height:54px;border:1px solid #c7b9aa;border-radius:9px;background:white}.seg button.on{background:var(--blue);color:white;border-color:var(--blue)}.seg small{display:block;font-size:10px}
    .nums{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}.nums button,.rests button{min-height:48px;background:white;border:1px solid #cbbfb2;border-radius:9px;font-size:18px;font-weight:bold}.nums button:active,.rests button:active{background:#fff2ac}
    .rests{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.rests button{font-size:15px}.rests .mark,.rests button[data-rest="4"] .mark,.rests button[data-rest="2"] .mark,.rests button[data-rest="1"] .mark{display:block;font:20px/1.1 Arial,sans-serif}
    .score-part{position:absolute;z-index:5;top:calc(var(--row-height)/2);height:calc(var(--row-height)*2);width:34px;padding:0;border:0;background:transparent;transform:translateX(-50%)}.score-part svg{display:block;width:100%;height:100%;overflow:visible}.bar-symbol{position:absolute;z-index:7;left:-9px;top:calc(var(--row-height)/2);width:18px;height:calc(var(--row-height)*2);pointer-events:none;overflow:visible}.measure:first-child>.bar-symbol{left:0}.bar-symbol.end-bar{left:auto;right:0}.measure.custom-bar::before,.measure.custom-end::after{display:none}
    .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#766b60}.clear{border:1px solid #d1aaa1;border-radius:9px;background:#fff;color:#9d4036;padding:9px}
    .layer-panel,.note-color-panel{margin-top:12px;padding:14px;background:#f8f3eb;border:1px solid #c9bcad;border-radius:15px}.layer-top,.layer-switches,.draw-tools,.colors,.edit-tools,.color-settings{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.layer-top{justify-content:space-between}
    .layer-switches{margin-top:10px}.layer-card{display:grid;grid-template-columns:minmax(110px,1fr) auto;gap:8px;align-items:center;padding:7px;border:1px solid #bcae9e;border-radius:10px;background:#fff}.layer-chip,.draw-tools button,.layer-top button{min-height:42px;border:1px solid #bcae9e;border-radius:9px;background:#fff;padding:7px 11px}.layer-card .layer-chip{border:0;text-align:left}.layer-chip.on,.draw-tools button.on{background:#477d91;color:#fff;border-color:#477d91}.layer-chip.hidden{text-decoration:line-through;opacity:.58}.layer-chip small{display:block;font-size:10px}.layer-options{display:flex;gap:8px;flex-wrap:wrap}.layer-options label{display:flex;align-items:center;gap:4px;min-height:38px;padding:4px 7px;border-radius:7px;background:#f8f3eb;font-size:12px;font-weight:600}.layer-options input{width:18px;height:18px}
    .draw-tools{margin-top:12px;padding-top:12px;border-top:1px solid #ddd2c5}.colors{margin-left:auto}.color{width:38px;height:38px!important;min-height:38px!important;border-radius:50%!important;padding:0!important;background:var(--c)!important}.color.on{outline:3px solid #fff;box-shadow:0 0 0 3px #477d91}.layer-help{margin:8px 0 0;font-size:12px;color:#75695d}
    .edit-tools,.color-settings{margin-top:9px}.edit-tools button,.color-settings button,.color-settings select,.color-settings input{min-height:42px;border:1px solid #bcae9e;border-radius:9px;background:#fff;padding:7px 11px}.edit-tools button:disabled,.layer-top button:disabled,.color-settings input:disabled,.color-settings select:disabled{opacity:.45;cursor:not-allowed}.color-settings label{display:flex;align-items:center;gap:6px;font-size:13px}.color-settings input[type=color]{width:48px;padding:3px}.color-settings input[type=number]{width:82px}.note-color-panel h2{margin:0 0 8px;font:600 18px serif}.note-color-panel p{margin:7px 0 0;font-size:12px;color:#75695d}
    .symbol-tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px;width:100%;padding-top:9px;border-top:1px dashed #d6c9bb}.symbol-tools strong{width:100%;font-size:13px;color:#665b50}.symbol-tools button{min-width:48px;min-height:42px;padding:4px 7px;font-size:13px;line-height:1.2}.symbol-tools button.on{background:#795548;color:#fff;border-color:#795548}.symbol-tools .roman{font-family:"Times New Roman",serif;font-size:18px}
    .layer-chip.fixed::before{content:"🔒 ";font-size:12px}.annotation-item.symbol-item text{font-family:"Yu Mincho","Times New Roman",serif;font-weight:700}
    dialog{width:min(92vw,480px);border:1px solid #bbaea0;border-radius:16px;padding:0;box-shadow:0 18px 50px #0005}dialog::backdrop{background:#332c2588}
    .dialog-body{padding:22px}.dialog-body h2{margin:0 0 8px;font:600 24px serif}.dialog-body p{margin:0 0 18px;color:#6d6257}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-grid label{font-size:13px;font-weight:bold}.form-grid input{width:100%;margin-top:6px;padding:11px;border:1px solid #bcae9e;border-radius:9px;font-size:18px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .dialog-actions button{min-height:44px;padding:9px 18px;border:1px solid #bcae9e;border-radius:9px;background:#fff}.dialog-actions .primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .print-options{display:grid;gap:10px;margin-top:14px}.print-options label{display:flex;align-items:center;gap:8px;font-weight:600}.print-options input[type=text]{width:100%;padding:10px;border:1px solid #bcae9e;border-radius:9px}.print-plan{margin:10px 0 0;padding:10px;border-radius:9px;background:var(--pale);font-weight:600;color:#285366}.print-error{min-height:1.5em;margin:7px 0 0;color:#9d4036;font-size:13px}.manual-print[hidden]{display:none}
    .page-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border:1px solid #477d91;border-radius:9px;background:#477d91;color:#fff;padding:8px 12px;text-decoration:none}
    body.score-page .layer-panel,body.score-page .annotation-svg{display:none}
    body.annotation-page .panel,body.annotation-page .note-color-panel,body.annotation-page #newScore{display:none}
    body.annotation-page #scoreArea{pointer-events:none}
    .base-layer-note{margin:8px 0 0;color:#75695d;font-size:12px}
    @media(max-width:650px){.app{padding:9px}.head{align-items:start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.paper{padding:17px 8px 24px}.meta{grid-template-columns:1fr;gap:5px;text-align:center}.meta span:last-child{text-align:center}.meta input{font-size:24px}.staff{margin-top:22px}.score-wrap{grid-template-columns:42px minmax(0,1fr)}.staff-head{margin-left:42px}.labels{padding-right:4px;font-size:11px}.panel{padding:12px}.layout-bar,.status{align-items:stretch;flex-direction:column}.layout-controls{justify-content:center}.controls{grid-template-columns:1fr}.nums{grid-template-columns:repeat(5,1fr)}.nums button{min-height:54px}.rests{grid-template-columns:repeat(2,1fr)}.bottom{align-items:stretch;flex-direction:column;gap:8px}.form-grid{grid-template-columns:1fr}.colors{margin-left:0}.draw-tools button{flex:1 0 28%}.layer-card{grid-template-columns:1fr}}
    @page{size:A4 portrait;margin:7mm}
    @media print{html,body{width:210mm}body{background:#fff}.app{max-width:none;padding:0}.head,.panel,.layer-panel,.note-color-panel,dialog{display:none!important}.paper{border:0;box-shadow:none;margin:0;padding:0;overflow:visible}.score-scroll{overflow:visible}.score{width:100%}.measure{--row-height:var(--print-row-height,34px);min-width:0!important;width:auto;flex:var(--print-measure-grow,1) 1 0}.labels{grid-template-rows:repeat(3,var(--print-row-height,34px));line-height:var(--print-row-height,34px)}.staff{margin-top:var(--print-staff-gap,28px);break-inside:avoid}.staff.print-page-start{break-before:page;padding-top:0}.note{height:calc(var(--print-row-height,34px) * .94)}.note b{font-size:var(--print-note-size,25px);line-height:calc(var(--print-note-size,25px) * 1.2)}.cell:nth-child(4n){border-right:0!important}.cell.cursor{background:none!important;box-shadow:none!important}.meta{grid-template-columns:1fr 2fr 1fr}#tuning{-webkit-appearance:none;appearance:none;background-image:none;padding-right:4px}}
  </style>
</head>
<body class="annotation-page">
<main class="app">
  <header class="head"><div><p class="brand">絲庵 ─ Shian ─</p><h1>書き込み</h1><p class="base-layer-note">写譜は最下層の表示専用レイヤーです。</p></div><div class="actions"><a class="page-link" href="./index.html">♪ 写譜ページ</a><button id="saveScoreFile">保存</button><button id="loadScoreFile">読込</button><button id="printPreview">印刷プレビュー</button><button id="undo">↶ 戻す</button><button id="redo">↷ やり直す</button></div></header>
  <input id="scoreFileInput" type="file" accept=".shian-score.json,.json,application/json" hidden>
  <section class="paper">
    <div class="meta"><div class="score-meta"><span>〈</span><select id="tuning" aria-label="調弦"><option>本調子</option><option selected>二上り</option><option>三下り</option></select><span>〉</span><input id="meter" value="四分ノ二拍子" aria-label="拍子"></div><input id="title" value="曲名入力" aria-label="曲名"><span id="summary"></span></div>
    <div id="scoreArea"></div>
    <svg id="annotations" class="annotation-svg" aria-label="書き込みレイヤー"></svg>
  </section>
  <section class="layer-panel">
    <div class="layer-top"><strong>書き込みレイヤー</strong><div><button id="toggleDrawing">✎ 描画を開始</button><button id="addLayer">＋ 個人レイヤー</button><button id="renameLayer">名前変更</button><button id="deleteLayer">削除</button></div></div>
    <div id="layerSwitches" class="layer-switches"></div>
    <div id="drawTools" class="draw-tools">
      <button data-tool="select">選択・移動</button><button data-tool="pen">自由線</button><button data-tool="arrow">矢印</button><button data-tool="rect">枠</button><button data-tool="text">コメント</button><button data-tool="eraser">消しゴム</button>
      <div id="colors" class="colors"></div>
    </div>
    <div class="edit-tools"><button id="editComment">コメント再編集</button><button id="deleteItem">選択項目を削除</button><button id="bringFront">最前面へ</button></div>
    <div class="color-settings">
      <label>線・文字色 <input id="itemColor" type="color" value="#d63c32"></label>
      <label>線の種類 <select id="lineStyle"><option value="solid">実線</option><option value="dashed">点線</option></select></label>
      <label>枠の横 <input id="rectWidth" type="number" inputmode="numeric" min="10" max="900" step="5" value="100" aria-label="枠の横幅"></label>
      <label>枠の縦 <input id="rectHeight" type="number" inputmode="numeric" min="10" max="1200" step="5" value="100" aria-label="枠の縦幅"></label>
      <label>コメント文字サイズ <select id="textSize"><option value="16">小</option><option value="20" selected>中</option><option value="26">大</option><option value="34">特大</option></select></label>
      <label>コメント背景 <select id="textBackground"><option value="white">白</option><option value="translucent">半透明</option><option value="none">なし</option></select></label>
    </div>
    <p id="layerHelp" class="layer-help">「描画を開始」を押すと、選択中の個人レイヤーへ書き込めます。</p>
  </section>
  <section class="note-color-panel">
    <h2>数字・開放弦の色</h2>
    <div class="color-settings">
      <label>数字の標準色 <input id="numberColor" type="color" value="#222222"></label>
      <label>開放弦の標準色 <input id="openColor" type="color" value="#222222"></label>
      <label>選択中の音 <input id="selectedNoteColor" type="color" value="#222222"></label>
      <button id="applySelectedNoteColor">この音だけ変更</button><button id="resetSelectedNoteColor">標準色へ戻す</button>
    </div>
    <p>休符は黒のままです。譜面上の数字・開放弦を選ぶと、その音だけ別色にできます。</p>
  </section>
  <section class="panel">
    <div class="layout-bar">
      <div class="layout-controls"><span>段数</span><button id="removeRow" aria-label="段を減らす">−</button><strong id="rowCount"></strong><button id="addRow" aria-label="段を増やす">＋</button></div>
      <div class="layout-controls"><span>1段の小節数</span><button id="removeMeasure" aria-label="小節を減らす">−</button><strong id="measureCount"></strong><button id="addMeasure" aria-label="小節を増やす">＋</button></div>
    </div>
    <div class="status"><div><small>現在の入力位置</small><strong id="status"></strong></div><div class="move"><button id="prev">←</button><button id="next">→</button><button id="delete" class="del">この音を削除</button></div></div>
    <div class="controls">
      <fieldset><legend>1. 糸を選ぶ</legend><div id="strings" class="seg"></div></fieldset>
      <fieldset><legend>2. 音の長さ</legend><div id="durations" class="seg"></div></fieldset>
    </div>
    <fieldset style="margin-top:14px"><legend>3. 数字・開放弦・休符を入れる</legend><div id="numbers" class="nums"></div><div id="rests" class="rests"></div></fieldset>
    <div class="bottom"><span>入力内容はこの端末に自動保存されます。</span><button id="clear" class="clear">譜面を空にする</button></div>
  </section>
</main>
<dialog id="newDialog">
  <form id="newForm" class="dialog-body">
    <h2>新しい文化譜を作る</h2>
    <p>段数と、1段に入れる小節数を指定してください。</p>
    <div class="form-grid">
      <label>段数<input id="initialRows" type="number" inputmode="numeric" min="1" max="20" value="1" required></label>
      <label>1段の小節数<input id="initialMeasures" type="number" inputmode="numeric" min="1" max="12" value="4" required></label>
    </div>
    <div class="dialog-actions"><button type="button" id="cancelNew">取消</button><button type="submit" class="primary">この設定で作成</button></div>
  </form>
</dialog>
<dialog id="printDialog">
  <form id="printForm" class="dialog-body">
    <h2>印刷設定</h2>
    <p>10段までは1ページ、11段以上は均等に分割します。</p>
    <div class="print-options">
      <label><input type="radio" name="printMode" value="auto" checked> 自動で均等分割</label>
      <label><input type="radio" name="printMode" value="manual"> ページごとの段数を指定</label>
      <div id="manualPrint" class="manual-print" hidden>
        <label for="manualPageRows">各ページの段数（例：8,7）</label>
        <input id="manualPageRows" type="text" inputmode="numeric" placeholder="8,7">
      </div>
    </div>
    <p id="printPlan" class="print-plan"></p>
    <p id="printError" class="print-error" role="alert"></p>
    <div class="dialog-actions"><button type="button" id="cancelPrint">取消</button><button type="submit" class="primary">印刷プレビューを開く</button></div>
  </form>
</dialog>
<script>
(()=>{"use strict";
const KEY="shian-bunkafu-editor-v2",OLD_KEY="shian-bunkafu-one-line-v1",vals=Array.from({length:20},(_,i)=>String(i+1));
const IS_ANNOTATION_PAGE=document.body.classList.contains("annotation-page");
const rests=[{d:4,label:"4分休符",mark:"●"},{d:2,label:"8分休符",mark:"●"},{d:1,label:"16分休符",mark:"●"}];
const colors=["#d63c32","#2474c6","#208750","#8b48a5","#e58b17","#222222"];
const TECHNIQUE_LAYER_ID="technique-layer";
const defaults={notes:[],scoreParts:[],barlineKinds:{},title:"曲名入力",tuning:"二上り",meter:"四分ノ二拍子",rows:1,measuresPerRow:4,measureOffsets:[],m:0,s:1,p:0,d:4,layers:[],activeLayerId:null,drawTool:"select",selectedSymbol:null,symbolSide:"above",drawColor:colors[0],lineStyle:"solid",numberColor:"#222222",openColor:"#222222",textSize:20,textBackground:"white",preview:true,annotationCoordVersion:2,printMode:"auto",manualPageRows:""};
let state={...defaults},past=[],future=[],hasSaved=false;
let drawing=false,draft=null,selectedItemId=null,dragging=null,printing=false;
const q=x=>document.querySelector(x),qAll=x=>document.querySelectorAll(x),clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
function load(){
  try{
    const current=JSON.parse(localStorage.getItem(KEY));
    if(current&&Array.isArray(current.notes)){state={...defaults,...current,annotationCoordVersion:current.annotationCoordVersion||1};ensureTechniqueLayer();hasSaved=true;return}
    const old=JSON.parse(localStorage.getItem(OLD_KEY));
    if(old&&Array.isArray(old.notes)){state={...defaults,notes:old.notes.map(n=>n.v==="0"?{...n,v:"○"}:n),title:old.title||defaults.title};ensureTechniqueLayer();hasSaved=true}
  }catch(error){console.warn("保存データを読み込めませんでした。",error)}
}
function ensureTechniqueLayer(){
  if(!Array.isArray(state.layers))state.layers=[];

  const p=pointFromEvent(event);
  if(state.drawTool==="select"){
    const target=event.target.closest("[data-item]"),id=target?.dataset.item;
    if(!id){selectedItemId=null;renderLayers();return}
    selectedItemId=id;const item=selectedItem();if(!item)return;
    event.preventDefault();snap();dragging={item,last:p};q("#annotations").setPointerCapture(event.pointerId);renderLayers();return;
  }
  if(state.drawTool==="text"){const text=prompt("譜面に入れるコメントを入力してください。","");if(text&&text.trim()){snap();const item={id:uid(),type:"text",x:p.x,y:p.y,text:text.trim(),color:state.drawColor,size:state.textSize,background:state.textBackground};layer.items.push(item);selectedItemId=item.id;render()}return}
  if(state.drawTool==="eraser"){const target=event.target.closest("[data-item]");if(target){snap();layer.items=layer.items.filter(item=>item.id!==target.dataset.item);render()}return}
  event.preventDefault();q("#annotations").setPointerCapture(event.pointerId);draft={type:state.drawTool,start:p,points:[p]};
}
function translateItem(item,dx,dy){if(item.type==="pen")item.points=item.points.map(p=>({x:p.x+dx,y:p.y+dy}));else if(item.type==="text"||item.type==="symbol"){item.x+=dx;item.y+=dy}else{item.x1+=dx;item.y1+=dy;item.x2+=dx;item.y2+=dy}}
function moveDraw(event){
  if(dragging){event.preventDefault();const p=pointFromEvent(event);translateItem(dragging.item,p.x-dragging.last.x,p.y-dragging.last.y);dragging.last=p;renderLayers();return}
  if(!draft)return;event.preventDefault();const p=pointFromEvent(event);if(draft.type==="pen")draft.points.push(p);else draft.end=p
}
function endDraw(event){
  if(dragging){dragging=null;save();renderLayers();return}
  if(!draft)return;const layer=activeLayer(),end=draft.end||pointFromEvent(event);snap();
  if(draft.type==="pen"&&draft.points.length>1){const item={id:uid(),type:"pen",points:draft.points,color:state.drawColor,lineStyle:state.lineStyle};layer.items.push(item);selectedItemId=item.id}
  else if(draft.type==="rect"&&Math.hypot(end.x-draft.start.x,end.y-draft.start.y)>5){const item={id:uid(),type:"rect",x1:draft.start.x,y1:draft.start.y,x2:end.x,y2:end.y,color:state.drawColor,lineStyle:state.lineStyle};layer.items.push(item);selectedItemId=item.id}
  else if(draft.type==="arrow"&&Math.hypot(end.x-draft.start.x,end.y-draft.start.y)>5){const item={id:uid(),type:"arrow",x1:draft.start.x,y1:draft.start.y,x2:end.x,y2:end.y,color:state.drawColor,lineStyle:state.lineStyle};layer.items.push(item);selectedItemId=item.id}
  else past.pop();
  draft=null;render();
}
function changeLayout(rows,measures){
  rows=clamp(Number(rows)||1,1,20);measures=clamp(Number(measures)||1,1,12);
  const newTotal=rows*measures,discard=state.notes.some(n=>n.m>=newTotal);
  if(discard&&!confirm("減らした範囲に入力済みの音があります。その音を削除して変更しますか？"))return false;
  snap();state.rows=rows;state.measuresPerRow=measures;state.notes=state.notes.filter(n=>n.m<newTotal);state.m=clamp(state.m,0,newTotal-1);render();return true;
}
function insert(value,isRest=false,duration=state.d){
  snap();const d=Math.min(duration,16-state.p);
  state.notes=state.notes.filter(n=>!(n.m===state.m&&n.s===state.s&&n.p===state.p));
  state.notes.push(isRest?{m:state.m,s:state.s,p:state.p,d,rest:true}:{m:state.m,s:state.s,p:state.p,d,v:value,color:value==="○"?state.openColor:state.numberColor});
  const np=state.p+d;if(np<16)state.p=np;else if(state.m<totalMeasures()-1){state.m++;state.p=0}
}
function openNew(){
  q("#initialRows").value=state.rows;q("#initialMeasures").value=state.measuresPerRow;
  if(typeof q("#newDialog").showModal==="function")q("#newDialog").showModal();else q("#newDialog").setAttribute("open","");
}
function updatePrintDialog(){
  const manual=state.printMode==="manual",container=q("#manualPrint"),error=q("#printError");
  qAll('input[name="printMode"]').forEach(input=>input.checked=input.value===state.printMode);
  container.hidden=!manual;q("#manualPageRows").value=state.manualPageRows||"";
  const parsed=manual?parseManualPageRows():{valid:true,rows:automaticPageRows(),message:""};
  q("#printPlan").textContent=parsed.valid?printPlanText(parsed.rows):printPlanText(automaticPageRows());
  error.textContent=parsed.message;
}
function openPrintSettings(){
  updatePrintDialog();
  if(typeof q("#printDialog").showModal==="function")q("#printDialog").showModal();else q("#printDialog").setAttribute("open","");
}
load();
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.s)state.s=+b.dataset.s;
  else if(b.dataset.d)state.d=+b.dataset.d;
  else if(b.dataset.pos)[state.m,state.s,state.p]=b.dataset.pos.split(",").map(Number);
  else if(b.dataset.v){insert(b.dataset.v)}
  else if(b.dataset.rest){insert("",true,+b.dataset.rest)}
  else if(b.id==="prev"){if(state.p>0)state.p--;else if(state.m>0){state.m--;state.p=15}}
  else if(b.id==="next"){if(state.p<15)state.p++;else if(state.m<totalMeasures()-1){state.m++;state.p=0}}
  else if(b.id==="delete"){const len=state.notes.length;snap();state.notes=state.notes.filter(n=>!(n.m===state.m&&n.s===state.s&&n.p===state.p));if(len===state.notes.length)past.pop()}
  else if(b.id==="clear"&&state.notes.length&&confirm("譜面の入力内容をすべて削除しますか？")){snap();state.notes=[];state.m=0;state.s=1;state.p=0}
  else if(b.id==="undo"&&past.length){future.unshift(JSON.stringify(serializable()));Object.assign(state,JSON.parse(past.pop()));selectedItemId=null}
  else if(b.id==="redo"&&future.length){past.push(JSON.stringify(serializable()));Object.assign(state,JSON.parse(future.shift()));selectedItemId=null}
  else if(b.id==="addRow"){changeLayout(state.rows+1,state.measuresPerRow);return}
  else if(b.id==="removeRow"){changeLayout(state.rows-1,state.measuresPerRow);return}
  else if(b.id==="addMeasure"){changeLayout(state.rows,state.measuresPerRow+1);return}
  else if(b.id==="removeMeasure"){changeLayout(state.rows,state.measuresPerRow-1);return}
  else if(b.id==="newScore"){openNew();return}
  else if(b.id==="saveScoreFile"){exportScoreFile();return}
  else if(b.id==="loadScoreFile"){q("#scoreFileInput").click();return}
  else if(b.id==="printPreview"){openPrintSettings();return}
  else if(b.id==="addLayer"){addLayer();return}
  else if(b.id==="renameLayer"){renameLayer();return}
  else if(b.id==="deleteLayer"){const layer=activeLayer();if(layer&&confirm(`「${layer.name}」レイヤーと書き込みを削除しますか？`)){snap();state.layers=state.layers.filter(x=>x.id!==layer.id);state.activeLayerId=state.layers.find(x=>x.id!==TECHNIQUE_LAYER_ID)?.id||null;drawing=false;render()}return}
  else if(b.id==="toggleDrawing"){if(!state.layers.length){addLayer();if(!state.layers.length)return}drawing=!drawing;renderLayers();return}
  else if(b.dataset.layer){state.activeLayerId=b.dataset.layer;selectedItemId=null;renderLayers();return}
  else if(b.dataset.tool){state.drawTool=b.dataset.tool;renderLayers();return}
  else if(b.dataset.color){state.drawColor=b.dataset.color;renderLayers();return}
  else if(b.id==="deleteItem"){const layer=activeLayer(),item=selectedItem();if(layer&&item){snap();layer.items=layer.items.filter(x=>x.id!==item.id);selectedItemId=null;render()}return}
  else if(b.id==="editComment"){const item=selectedItem();if(item?.type==="text"){const text=prompt("コメントを編集してください。",item.text);if(text!==null&&text.trim()){snap();item.text=text.trim();render()}}return}
  else if(b.id==="bringFront"){const layer=activeLayer(),item=selectedItem();if(layer&&item){snap();layer.items=layer.items.filter(x=>x.id!==item.id);layer.items.push(item);render()}return}
  else if(b.id==="applySelectedNoteColor"){const note=state.notes.find(n=>n.m===state.m&&n.s===state.s&&n.p===state.p);if(note&&!note.rest){snap();note.color=q("#selectedNoteColor").value;note.individualColor=true;render()}return}
  else if(b.id==="resetSelectedNoteColor"){const note=state.notes.find(n=>n.m===state.m&&n.s===state.s&&n.p===state.p);if(note&&!note.rest){snap();note.individualColor=false;note.color=note.v==="○"?state.openColor:state.numberColor;render()}return}
  else if(b.id==="cancelNew"){q("#newDialog").close();return}
  else if(b.id==="cancelPrint"){q("#printDialog").close();return}
  render();
});
q("#layerSwitches").addEventListener("change",event=>{const visibleId=event.target.dataset.layerVisible,printId=event.target.dataset.layerPrint,id=visibleId||printId;if(!id)return;const layer=state.layers.find(item=>item.id===id);if(!layer)return;snap();if(visibleId)layer.visible=event.target.checked;else layer.printEnabled=event.target.checked;render()});
q("#annotations").addEventListener("pointerdown",startDraw);
q("#annotations").addEventListener("pointermove",moveDraw);
q("#annotations").addEventListener("pointerup",endDraw);
q("#annotations").addEventListener("pointercancel",()=>{draft=null;dragging=null});
q("#itemColor").addEventListener("change",event=>{const item=selectedItem();if(item){snap();item.color=event.target.value}else state.drawColor=event.target.value;render()});
q("#lineStyle").addEventListener("change",event=>{const value=event.target.value==="dashed"?"dashed":"solid",item=selectedItem();state.lineStyle=value;if(item&&["pen","arrow","rect"].includes(item.type)){snap();item.lineStyle=value}render()});
function resizeSelectedRect(axis,value){const item=selectedItem();if(item?.type!=="rect")return;const next=clamp(Number(value)||10,10,axis==="x"?900:1200);snap();if(axis==="x"){const direction=item.x2>=item.x1?1:-1;item.x2=item.x1+direction*next}else{const direction=item.y2>=item.y1?1:-1;item.y2=item.y1+direction*next}render()}
q("#rectWidth").addEventListener("change",event=>resizeSelectedRect("x",event.target.value));
q("#rectHeight").addEventListener("change",event=>resizeSelectedRect("y",event.target.value));
q("#textSize").addEventListener("change",event=>{const item=selectedItem(),value=+event.target.value;state.textSize=value;if(item?.type==="text"){snap();item.size=value}render()});
q("#textBackground").addEventListener("change",event=>{const item=selectedItem();state.textBackground=event.target.value;if(item?.type==="text"){snap();item.background=event.target.value}render()});
q("#numberColor").addEventListener("change",event=>{snap();state.numberColor=event.target.value;state.notes.filter(n=>!n.rest&&n.v!=="○"&&!n.individualColor).forEach(n=>n.color=state.numberColor);render()});
q("#openColor").addEventListener("change",event=>{snap();state.openColor=event.target.value;state.notes.filter(n=>!n.rest&&n.v==="○"&&!n.individualColor).forEach(n=>n.color=state.openColor);render()});
q("#title").addEventListener("input",updateTitleWidth);
q("#title").addEventListener("change",e=>{snap();state.title=e.target.value;render()});
q("#scoreFileInput").addEventListener("change",async event=>{const file=event.target.files?.[0];event.target.value="";await importScoreFile(file)});
q("#newForm").addEventListener("submit",e=>{e.preventDefault();
  if((state.notes.length||state.title!=="曲名入力")&&!confirm("現在の譜面を消して、新規作成しますか？"))return;
  const rows=clamp(+q("#initialRows").value,1,20),measures=clamp(+q("#initialMeasures").value,1,12);
  snap();state={...defaults,notes:[],layers:[{id:TECHNIQUE_LAYER_ID,name:"奏法",visible:true,fixed:true,items:[]}],rows,measuresPerRow:measures};selectedItemId=null;q("#newDialog").close();render();
});
qAll('input[name="printMode"]').forEach(input=>input.addEventListener("change",event=>{state.printMode=event.target.value;updatePrintDialog()}));
q("#manualPageRows").addEventListener("input",event=>{state.manualPageRows=event.target.value;updatePrintDialog()});
q("#printForm").addEventListener("submit",event=>{
  event.preventDefault();
  if(state.printMode==="manual"){const parsed=parseManualPageRows();if(!parsed.valid){q("#printError").textContent=parsed.message;return}}
  save();q("#printDialog").close();render();requestAnimationFrame(()=>window.print());
});
function applyPrintLayout(){
  printing=true;
  render();
  const pageRows=currentPageRows(),staffs=qAll(".staff");
  const printableHeight=283*96/25.4;
  const titleGapExtra=20;
  const metaHeight=q(".meta")?.getBoundingClientRect().height||34;
  let staffIndex=0;
  pageRows.forEach((count,pageIndex)=>{
    const usableHeight=printableHeight-(pageIndex===0?metaHeight:0);
    const distribute=count>=6;
    const rowHeight=distribute?clamp(60-count*3.2,28,34):34;
    const extraFirstGap=distribute&&pageIndex===0?titleGapExtra:0;
    const staffGap=distribute
      ?Math.max(8,(usableHeight-count*rowHeight*3-extraFirstGap)/(count+1))
      :20;
    const noteSize=clamp(rowHeight*.82,18,25);
    for(let row=0;row<count;row+=1){
      const staff=staffs[staffIndex++];
      if(!staff)break;
      const gap=staffGap+(row===0?extraFirstGap:0);
      staff.style.setProperty("--print-staff-gap",`${gap.toFixed(2)}px`);
      staff.style.setProperty("--print-row-height",`${rowHeight}px`);
      staff.style.setProperty("--print-note-size",`${noteSize.toFixed(2)}px`);
      staff.querySelectorAll(".measure").forEach((measure,index)=>measure.style.setProperty("--print-measure-grow",String(measureWidth((staffIndex-1)*state.measuresPerRow+index))));
    }
  });
}
window.addEventListener("beforeprint",applyPrintLayout);
window.addEventListener("afterprint",()=>{
  printing=false;
  qAll(".staff").forEach(staff=>{
    staff.style.removeProperty("--print-staff-gap");
    staff.style.removeProperty("--print-row-height");
    staff.style.removeProperty("--print-note-size");
    staff.querySelectorAll(".measure").forEach(measure=>measure.style.removeProperty("--print-measure-grow"));
  });
  render();
});
window.addEventListener("resize",()=>{applyPreview()},{passive:true});
window.addEventListener("storage",event=>{if(event.key!==KEY||!event.newValue)return;try{state={...defaults,...JSON.parse(event.newValue)};render()}catch(error){console.warn("更新された譜面を読み込めませんでした。",error)}});
window.addEventListener("pageshow",()=>{try{const latest=JSON.parse(localStorage.getItem(KEY)||"null");if(latest){state={...defaults,...latest};render()}}catch(error){console.warn("最新の譜面を読み込めませんでした。",error)}});
render();if(!hasSaved&&!IS_ANNOTATION_PAGE)openNew();
})();
</script>
</body>
