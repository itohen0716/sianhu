    body.annotation-page .panel,body.annotation-page .note-color-panel,body.annotation-page #newScore{display:none}
    body.annotation-page #scoreArea{pointer-events:auto}body.annotation-page #scoreArea .score-wrap{pointer-events:none}body.annotation-page #scoreArea .lyrics-input{pointer-events:auto}
    .base-layer-note{margin:8px 0 0;color:#75695d;font-size:12px}
    /* v90: 300pxの操作列を固定し、文化譜領域だけを横スクロールする。 */
    .app{width:100%;max-width:none;margin-left:auto;margin-right:auto}
    .workspace-shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start;width:100%;margin-top:12px}

    .score-toolbar button,.score-toolbar .page-link{min-height:42px}

    .tool-rail .edit-tools button{flex:1 1 44%}
    .tool-rail .color-settings{flex-direction:column}
    .tool-rail button{padding-left:7px;padding-right:7px}

    .player-modal[hidden]{display:none}.player-modal{position:fixed;z-index:10000;inset:0;display:grid;place-items:start;padding:14px;background:rgba(49,40,31,.34)}.player-dialog{position:relative;width:min(370px,calc(100vw - 28px));height:min(340px,calc(100vh - 28px));overflow:hidden;border:1px solid #bcae9e;border-radius:15px;background:#fffdf8;box-shadow:0 14px 42px rgba(42,32,22,.3)}.player-dialog iframe{display:block;width:100%;height:100%;border:0}.player-close{position:absolute;z-index:2;top:7px;right:8px;width:34px;height:34px;border:1px solid #ad9984;border-radius:50%;background:#fff;color:#4f4034;font-size:21px;line-height:1;cursor:pointer}.player-modal-open{overflow:hidden}
    @media(max-width:650px){.app{padding:9px}.head{align-items:start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.paper{padding:17px 8px 24px}.meta{grid-template-columns:1fr;gap:5px;text-align:center}.meta span:last-child{text-align:center}.meta input{font-size:24px}.staff{margin-top:22px}.score-wrap{grid-template-columns:42px minmax(0,1fr)}.staff-head{margin-left:42px}.labels{padding-right:4px;font-size:11px}.panel{padding:12px}.layout-bar,.status{align-items:stretch;flex-direction:column}.layout-controls{justify-content:center}.controls{grid-template-columns:1fr}.tool-rail .nums{grid-template-columns:repeat(5,minmax(0,1fr))}.tool-rail .nums button{min-width:0;min-height:54px}.tool-rail .rests{grid-template-columns:repeat(2,minmax(0,1fr))}.tool-rail .rests button{min-width:0}.bottom{align-items:stretch;flex-direction:column;gap:8px}.form-grid{grid-template-columns:1fr}.colors{margin-left:0}.draw-tools button{flex:1 0 28%}.layer-card{grid-template-columns:1fr}.score-viewport{width:100%;overflow-x:auto;overflow-y:visible;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.score-viewport>.paper{width:1100px;min-width:1100px;max-width:none;zoom:.85}.score-toolbar{width:auto;min-width:0}}
    @page{size:A4 portrait;margin:7mm}
    @media print{html,body{width:210mm}body{background:#fff}.app{max-width:none;padding:0}.head,.panel,.layer-panel,.note-color-panel,dialog{display:none!important}.paper{border:0;box-shadow:none;margin:0;padding:0;overflow:visible}.score-scroll{overflow:visible}.score{width:100%}.measure{--row-height:var(--print-row-height,34px);min-width:0!important;width:auto;flex:var(--print-measure-grow,1) 1 0}.labels{grid-template-rows:repeat(3,var(--print-row-height,34px));line-height:var(--print-row-height,34px)}.staff{margin-top:var(--print-staff-gap,28px);break-inside:avoid}.staff.print-page-start{break-before:page;padding-top:0}.note{height:calc(var(--print-row-height,34px) * .94)}.note b{font-size:var(--print-note-size,25px);line-height:calc(var(--print-note-size,25px) * 1.2)}.cell:nth-child(4n){border-right:0!important}.cell.cursor{background:none!important;box-shadow:none!important}.measure.on{background:transparent!important}.measure.on .note b{background:var(--paper)!important}.annotation-item.selected{filter:none!important}.meta{grid-template-columns:1fr 2fr 1fr}#tuning{-webkit-appearance:none;appearance:none;background-image:none;padding-right:4px}}
    .print-technique{display:none}
    @media print{.measure{--row-height:18px!important}.labels{grid-template-rows:repeat(3,18px)!important;line-height:18px!important}.note{top:0!important;height:14px!important}.note b{font-size:var(--note-size)!important;line-height:14px!important}.note.open-note b{font-size:28px!important;line-height:14px!important;font-weight:400!important}.annotation-item.symbol-item text{font-size:14px!important}.annotation-item.anchored-symbol{display:none!important}.annotation-item.anchored-symbol.finger-symbol{display:inline!important}.annotation-item.anchored-symbol.finger-symbol text{font-size:24px!important;font-weight:700!important}.print-technique{display:block;position:absolute;z-index:9;left:calc(50% + 6px + var(--tech-x,0px));top:calc(-22px + var(--tech-y,0px));width:var(--tech-width,42px);height:28px;overflow:visible;pointer-events:none;transform:translateX(-50%);color:var(--tech-color,#222)}.print-technique.below{top:calc(8px + var(--tech-y,0px))}.print-technique text{font-family:"Yu Mincho","Times New Roman",serif;font-size:14px;font-weight:700;fill:currentColor;text-anchor:middle}.print-technique path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}}
    /* v50: 音符・音価線の座標指定をここだけに集約 */
    .measure{--row-height:18px;--note-height:14px}
    .note{align-self:stretch;position:relative;height:var(--row-height);line-height:0;appearance:none;-webkit-appearance:none}
    .note b,.note.open-note b{position:absolute;z-index:2;left:50%;top:50%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:12px;height:var(--note-height);min-height:0;line-height:var(--note-height);transform:translate(-50%,-50%)}
    .note.open-note b{font-size:28px;line-height:1}

    .note.d1:not(.rest)::after{height:3px}
    @media print{
      /* 奏法が段境界・改ページ境界で欠けないよう、譜線の上側を段内領域として確保する。 */
      .staff{
        --print-technique-clearance:20px;
        margin-top:max(0px,calc(var(--print-staff-gap,28px) - var(--print-technique-clearance)))!important;
        padding-top:var(--print-technique-clearance)!important;
      }
      .staff.print-page-start{padding-top:var(--print-technique-clearance)!important}
      .measure{--row-height:18px!important;--note-height:14px!important}
      .note{align-self:stretch!important;height:var(--row-height)!important;line-height:0!important}
      .note b,.note.open-note b{left:50%!important;top:50%!important;height:var(--note-height)!important;min-height:0!important;line-height:var(--note-height)!important;transform:translate(-50%,-50%)!important}
      .note.open-note b{font-size:28px!important;line-height:1!important}
      .note.d2:not(.rest)::after,.note.d1:not(.rest)::after{top:calc(50% + 8px)!important}
      .note.d1:not(.rest)::after{height:3px!important}
      /* 印刷奏法は四分音符の数字を基準に、全段で同じ位置へ強制配置する。 */
      .print-technique{
        left:50%!important;
        top:50%!important;
        height:var(--tech-height,24px)!important;

<script>
(()=>{"use strict";
const KEY="shian-bunkafu-editor-v2",OLD_KEY="shian-bunkafu-one-line-v1",vals=Array.from({length:20},(_,i)=>String(i+1));

const TECHNIQUE_LAYER_ID="technique-layer";
const defaults={notes:[],scoreParts:[],barlineKinds:{},title:"曲名入力",tuning:"二上り",meter:"2/4",rows:1,measuresPerRow:4,rowMeasureCounts:[4],measureOffsets:[],lyricsMode:false,lyrics:[],m:0,s:1,p:0,d:4,layers:[],activeLayerId:null,drawTool:"select",selectedSymbol:null,symbolSide:"above",drawColor:colors[0],lineStyle:"solid",numberColor:"#222222",openColor:"#222222",textSize:20,textBackground:"white",preview:true,annotationCoordVersion:2,printMode:"auto",manualPageRows:""};
let state={...defaults},past=[],future=[],hasSaved=false;
let drawing=false,draft=null,selectedItemId=null,dragging=null,printing=false,lastInserted=null;
const q=x=>document.querySelector(x),qAll=x=>document.querySelectorAll(x),clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
function toAscii(value){return String(value??"").replace(/[０-９]/g,ch=>String(ch.charCodeAt(0)-0xFEE0)).replace(/[／]/g,"/").trim()}
function parseMeter(value){const raw=toAscii(value).replace(/\s+/g,"");let match=raw.match(/^(\d{1,2})\/(\d{1,2})$/);if(!match){const nums=raw.match(/(三十二|十六|十二|十一|十|一|二|三|四|五|六|七|八|九|\d+)/g);if(nums?.length>=2){const map={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,十一:11,十二:12,十六:16,三十二:32};match=[raw,String(map[nums[1]]||nums[1]),String(map[nums[0]]||nums[0])]}}if(!match)return null;const numerator=Number(match[1]),denominator=Number(match[2]);if(!Number.isInteger(numerator)||numerator<1||numerator>99||![1,2,4,8,16].includes(denominator))return null;const capacity=16*numerator/denominator;if(!Number.isInteger(capacity)||capacity<1||capacity>64)return null;return{numerator,denominator,capacity,signature:`${numerator}/${denominator}`}}

function nextMusicalPosition(m,duration){

function barlineKey(row,boundary){return`${row}:${boundary}`}

function ensureTechniqueLayer(){

function automaticPageRows(rowCount=state.rows){

function parseManualPageRows(value=state.manualPageRows){

function currentPageRows(){

}
function pageStartRows(pageRows=currentPageRows()){

}
function printPlanText(pageRows=currentPageRows()){return`${pageRows.length}ページ：${pageRows.map(count=>`${count}段`).join(" ＋ ")}`}

function openScorePlayer(){

  save();

}
function closeScorePlayer(){const modal=q("#playerModal"),frame=q("#scorePlayerFrame");try{frame.contentWindow?.postMessage({type:"SHIAN_PLAYER_STOP"},location.origin)}catch(error){console.warn("プレーヤーを停止できませんでした。",error)}modal.hidden=true;document.body.classList.remove("player-modal-open");q("#playScore")?.focus()}
function safeFileName(value){const name=String(value||"文化譜").trim().replace(/[\\/:*?"<>|]/g,"_").replace(/\s+/g," ");return(name&&name!=="曲名入力"?name:"文化譜").slice(0,80)}
function updateTitleWidth(){const el=q("#title");if(!el)return;const length=Math.max(1,Array.from(el.value||"").length);el.style.width=`min(100%, ${length+2}em)`}
function downloadScoreBlob(blob,fileName){

  link.href=url;link.download=fileName;document.body.appendChild(link);link.click();link.remove();

async function exportScoreFile(){

function validatedImportedScore(value){

async function importScoreFile(file){

  if(state.drawTool==="text"){const text=prompt("譜面に入れるコメントを入力してください。","");if(text&&text.trim()){snap();const item={id:uid(),type:"text",x:p.x,y:p.y,text:text.trim(),color:state.drawColor,size:state.textSize,background:state.textBackground};layer.items.push(item);selectedItemId=item.id;render()}return}
  if(state.drawTool==="eraser"){const target=event.target.closest("[data-item]");if(target){snap();layer.items=layer.items.filter(item=>item.id!==target.dataset.item);render()}return}
  event.preventDefault();q("#annotations").setPointerCapture(event.pointerId);draft={type:state.drawTool,start:p,points:[p]};
}
function translateItem(item,dx,dy){if(item.type==="pen")item.points=item.points.map(p=>({x:p.x+dx,y:p.y+dy}));else if(item.type==="text"||item.type==="symbol"){item.x+=dx;item.y+=dy}else{item.x1+=dx;item.y1+=dy;item.x2+=dx;item.y2+=dy}}
function moveDraw(event){
  if(dragging){event.preventDefault();const p=pointFromEvent(event);translateItem(dragging.item,p.x-dragging.last.x,p.y-dragging.last.y);dragging.last=p;renderLayers();return}
  if(!draft)return;event.preventDefault();const p=pointFromEvent(event);if(draft.type==="pen")draft.points.push(p);else draft.end=p
}
function endDraw(event){
  if(dragging){dragging=null;save();renderLayers();return}
  if(!draft)return;const layer=activeLayer(),end=draft.end||pointFromEvent(event);snap();
  if(draft.type==="pen"&&draft.points.length>1){const item={id:uid(),type:"pen",points:draft.points,color:state.drawColor,lineStyle:state.lineStyle};layer.items.push(item);selectedItemId=item.id}
  else if(draft.type==="rect"&&Math.hypot(end.x-draft.start.x,end.y-draft.start.y)>5){const item={id:uid(),type:"rect",x1:draft.start.x,y1:draft.start.y,x2:end.x,y2:end.y,color:state.drawColor,lineStyle:state.lineStyle};layer.items.push(item);selectedItemId=item.id}
  else if(draft.type==="arrow"&&Math.hypot(end.x-draft.start.x,end.y-draft.start.y)>5){const item={id:uid(),type:"arrow",x1:draft.start.x,y1:draft.start.y,x2:end.x,y2:end.y,color:state.drawColor,lineStyle:state.lineStyle};layer.items.push(item);selectedItemId=item.id}
  else past.pop();
  draft=null;render();
}
function changeLayout(rows,measures){
  rows=clamp(Number(rows)||1,1,20);measures=clamp(Number(measures)||1,1,12);
  normalizeRowMeasureCounts();const oldCounts=[...state.rowMeasureCounts],selectedRow=measureLocation(state.m).row,newCounts=Array.from({length:rows},(_,row)=>row<selectedRow?(oldCounts[row]||measures):measures),newTotal=newCounts.reduce((sum,count)=>sum+count,0);
  const oldLocation=m=>{let start=0;for(let row=0;row<oldCounts.length;row++){if(m<start+oldCounts[row])return{row,local:m-start};start+=oldCounts[row]}return null},newIndex=(row,local)=>newCounts.slice(0,row).reduce((sum,count)=>sum+count,0)+local,keepPosition=m=>{const pos=oldLocation(m);return pos&&pos.row<rows&&pos.local<newCounts[pos.row]?newIndex(pos.row,pos.local):null};
  const discard=state.notes.some(n=>keepPosition(n.m)===null);
  if(discard&&!confirm("減らした範囲に入力済みの音があります。その音を削除して変更しますか？"))return false;
  snap();state.notes=state.notes.flatMap(note=>{const m=keepPosition(note.m);return m===null?[]:[{...note,m}]});state.scoreParts=(state.scoreParts||[]).flatMap(part=>{const m=keepPosition(part.m);return m===null?[]:[{...part,m}]});state.layers=(state.layers||[]).map(layer=>({...layer,items:(layer.items||[]).flatMap(item=>{if(!item.anchor)return[item];const m=keepPosition(item.anchor.m);return m===null?[]:[{...item,anchor:{...item.anchor,m}}]})}));const current=keepPosition(state.m);state.rows=rows;state.rowMeasureCounts=newCounts;state.measuresPerRow=newCounts[0];state.m=current===null?clamp(state.m,0,newTotal-1):current;render();return true;
}
function insert(value,isRest=false,duration=state.d){
  const d=duration,capacity=measureCapacity();
  if(![1,2,4].includes(d))return false;
  const continuesChord=lastInserted&&lastInserted.d===d&&lastInserted.s!==state.s&&!state.notes.some(n=>n.m===lastInserted.m&&n.s===state.s&&n.p===lastInserted.p);
  if(continuesChord){state.m=lastInserted.m;state.p=lastInserted.p}
  else{
    const target=nextMusicalPosition(state.m,d);
    if(!target){alert("この音価を入れられる小節がありません。段または小節を追加してください。");return false}
    if(target.m!==state.m)lastInserted=null;
    state.m=target.m;state.p=target.p;
  }
  snap();
  state.notes=state.notes.filter(n=>!(n.m===state.m&&n.s===state.s&&n.p===state.p));
  state.notes.push(isRest?{m:state.m,s:state.s,p:state.p,d,rest:true}:{m:state.m,s:state.s,p:state.p,d,v:value,color:value==="○"?state.openColor:state.numberColor});
  lastInserted={m:state.m,s:state.s,p:state.p,d};
  const np=state.p+d;if(np<capacity)state.p=np;else if(state.m<totalMeasures()-1){state.m++;state.p=measureUsedDuration(state.m)}
  return true;
}
function openNew(){
  q("#initialRows").value=state.rows;q("#initialMeasures").value=state.measuresPerRow;
  if(typeof q("#newDialog").showModal==="function")q("#newDialog").showModal();else q("#newDialog").setAttribute("open","");
}
function updatePrintDialog(){
  const manual=state.printMode==="manual",container=q("#manualPrint"),error=q("#printError");
  qAll('input[name="printMode"]').forEach(input=>input.checked=input.value===state.printMode);
  container.hidden=!manual;q("#manualPageRows").value=state.manualPageRows||"";
  const parsed=manual?parseManualPageRows():{valid:true,rows:automaticPageRows(),message:""};
  q("#printPlan").textContent=parsed.valid?printPlanText(parsed.rows):printPlanText(automaticPageRows());
  error.textContent=parsed.message;
}
function openPrintSettings(){
  updatePrintDialog();
  if(typeof q("#printDialog").showModal==="function")q("#printDialog").showModal();else q("#printDialog").setAttribute("open","");
}
load();
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.s){const nextString=+b.dataset.s;if(lastInserted&&lastInserted.s!==nextString&&!state.notes.some(n=>n.m===lastInserted.m&&n.s===nextString&&n.p===lastInserted.p)){state.m=lastInserted.m;state.p=lastInserted.p}state.s=nextString}
  else if(b.dataset.d)state.d=+b.dataset.d;
  else if(b.dataset.pos){[state.m,state.s,state.p]=b.dataset.pos.split(",").map(Number);lastInserted=null}
  else if(b.dataset.v){insert(b.dataset.v)}
  else if(b.dataset.rest){insert("",true,+b.dataset.rest)}
  else if(b.id==="prev"){if(state.p>0)state.p--;else if(state.m>0){state.m--;state.p=15}}
  else if(b.id==="next"){if(state.p<15)state.p++;else if(state.m<totalMeasures()-1){state.m++;state.p=0}}
  else if(b.id==="delete"){const len=state.notes.length;snap();state.notes=state.notes.filter(n=>!(n.m===state.m&&n.s===state.s&&n.p===state.p));if(len===state.notes.length)past.pop()}
  else if(b.id==="clear"){
    const hasAnnotations=(state.layers||[]).some(layer=>Array.isArray(layer.items)&&layer.items.length);
    const hasScoreContent=state.notes.length||state.scoreParts?.length||Object.keys(state.barlineKinds||{}).length;
    if((hasScoreContent||hasAnnotations)&&confirm("譜面と書き込みの入力内容をすべて削除しますか？")){
      snap();
      state.notes=[];state.scoreParts=[];state.barlineKinds={};
      state.layers=(state.layers||[]).map(layer=>({...layer,items:[]}));
      state.m=0;state.s=1;state.p=0;
      selectedItemId=null;lastInserted=null;drawing=false;
      q("#printRootV2")?.replaceChildren();
      save(true);
    }
  }
  else if(b.id==="undo"&&past.length){future.unshift(JSON.stringify(serializable()));Object.assign(state,JSON.parse(past.pop()));selectedItemId=null}
  else if(b.id==="redo"&&future.length){past.push(JSON.stringify(serializable()));Object.assign(state,JSON.parse(future.shift()));selectedItemId=null}
  else if(b.id==="addRow"){changeLayout(state.rows+1,measuresInRow(measureLocation(state.m).row));return}
  else if(b.id==="removeRow"){changeLayout(state.rows-1,measuresInRow(measureLocation(state.m).row));return}
  else if(b.id==="addMeasure"){changeLayout(state.rows,measuresInRow(measureLocation(state.m).row)+1);return}
  else if(b.id==="removeMeasure"){changeLayout(state.rows,measuresInRow(measureLocation(state.m).row)-1);return}
  else if(b.id==="newScore"){openNew();return}
  else if(b.id==="playScore"){openScorePlayer();return}
  else if(b.id==="saveScoreFile"){exportScoreFile();return}
  else if(b.id==="loadScoreFile"){q("#scoreFileInput").click();return}
  else if(b.id==="printPreview"){openPrintSettings();return}
  else if(b.id==="addLayer"){addLayer();return}
  else if(b.id==="renameLayer"){renameLayer();return}
  else if(b.id==="deleteLayer"){const layer=activeLayer();if(layer&&confirm(`「${layer.name}」レイヤーと書き込みを削除しますか？`)){snap();state.layers=state.layers.filter(x=>x.id!==layer.id);state.activeLayerId=state.layers.find(x=>x.id!==TECHNIQUE_LAYER_ID)?.id||null;drawing=false;render()}return}
  else if(b.id==="toggleDrawing"){if(!state.layers.length){addLayer();if(!state.layers.length)return}drawing=!drawing;renderLayers();return}
  else if(b.dataset.layer){state.activeLayerId=b.dataset.layer;selectedItemId=null;renderLayers();return}
  else if(b.dataset.tool){state.drawTool=b.dataset.tool;renderLayers();return}
  else if(b.dataset.color){state.drawColor=b.dataset.color;renderLayers();return}
  else if(b.id==="deleteItem"){const layer=activeLayer(),item=selectedItem();if(layer&&item){snap();layer.items=layer.items.filter(x=>x.id!==item.id);selectedItemId=null;render()}return}
  else if(b.id==="editComment"){const item=selectedItem();if(item?.type==="text"){const text=prompt("コメントを編集してください。",item.text);if(text!==null&&text.trim()){snap();item.text=text.trim();render()}}return}
  else if(b.id==="bringFront"){const layer=activeLayer(),item=selectedItem();if(layer&&item){snap();layer.items=layer.items.filter(x=>x.id!==item.id);layer.items.push(item);render()}return}
  else if(b.id==="applySelectedNoteColor"){const note=state.notes.find(n=>n.m===state.m&&n.s===state.s&&n.p===state.p);if(note&&!note.rest){snap();note.color=q("#selectedNoteColor").value;note.individualColor=true;render()}return}
  else if(b.id==="resetSelectedNoteColor"){const note=state.notes.find(n=>n.m===state.m&&n.s===state.s&&n.p===state.p);if(note&&!note.rest){snap();note.individualColor=false;note.color=note.v==="○"?state.openColor:state.numberColor;render()}return}
  else if(b.id==="cancelNew"){q("#newDialog").close();return}
  else if(b.id==="cancelPrint"){q("#printDialog").close();return}
  render();
});
q("#layerSwitches").addEventListener("change",event=>{const visibleId=event.target.dataset.layerVisible,printId=event.target.dataset.layerPrint,id=visibleId||printId;if(!id)return;const layer=state.layers.find(item=>item.id===id);if(!layer)return;snap();if(visibleId)layer.visible=event.target.checked;else layer.printEnabled=event.target.checked;render()});
q("#annotations").addEventListener("pointerdown",startDraw);
q("#annotations").addEventListener("pointermove",moveDraw);
q("#annotations").addEventListener("pointerup",endDraw);
q("#annotations").addEventListener("pointercancel",()=>{draft=null;dragging=null});
q("#itemColor").addEventListener("change",event=>{const item=selectedItem();if(item){snap();item.color=event.target.value}else state.drawColor=event.target.value;render()});
q("#lineStyle").addEventListener("change",event=>{const value=event.target.value==="dashed"?"dashed":"solid",item=selectedItem();state.lineStyle=value;if(item&&["pen","arrow","rect"].includes(item.type)){snap();item.lineStyle=value}render()});
function resizeSelectedRect(axis,value){const item=selectedItem();if(item?.type!=="rect")return;const next=clamp(Number(value)||10,10,axis==="x"?900:1200);snap();if(axis==="x"){const direction=item.x2>=item.x1?1:-1;item.x2=item.x1+direction*next}else{const direction=item.y2>=item.y1?1:-1;item.y2=item.y1+direction*next}render()}

q("#openColor").addEventListener("change",event=>{snap();state.openColor=event.target.value;state.notes.filter(n=>!n.rest&&n.v==="○"&&!n.individualColor).forEach(n=>n.color=state.openColor);render()});
q("#title").addEventListener("input",updateTitleWidth);
q("#title").addEventListener("change",e=>{snap();state.title=e.target.value;render()});
q("#scoreFileInput").addEventListener("change",async event=>{const file=event.target.files?.[0];event.target.value="";await importScoreFile(file)});
q("#newForm").addEventListener("submit",e=>{e.preventDefault();
  if((state.notes.length||state.title!=="曲名入力")&&!confirm("現在の譜面を消して、新規作成しますか？"))return;
  const rows=clamp(+q("#initialRows").value,1,20),measures=clamp(+q("#initialMeasures").value,1,12);
  snap();state={...defaults,notes:[],layers:[{id:TECHNIQUE_LAYER_ID,name:"奏法",visible:true,fixed:true,items:[]}],rows,measuresPerRow:measures,rowMeasureCounts:Array(rows).fill(measures)};selectedItemId=null;q("#newDialog").close();render();
});
qAll('input[name="printMode"]').forEach(input=>input.addEventListener("change",event=>{state.printMode=event.target.value;updatePrintDialog()}));

  event.preventDefault();

q("#scoreArea").addEventListener("input",event=>{const input=event.target.closest("[data-lyrics-row]");if(!input)return;const row=Number(input.dataset.lyricsRow);if(Number.isInteger(row)&&row>=0&&row<state.rows){state.lyrics[row]=input.value;save()}});
q("#closePlayer").addEventListener("click",closeScorePlayer);q("#playerModal").addEventListener("click",event=>{if(event.target===q("#playerModal"))closeScorePlayer()});document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!q("#playerModal").hidden)closeScorePlayer()});
document.addEventListener("keydown",event=>{if(event.ctrlKey||event.metaKey||event.altKey||!(event.key==="ArrowLeft"||event.key==="ArrowRight"))return;const target=event.target;if(target instanceof HTMLInputElement||target instanceof HTMLTextAreaElement||target instanceof HTMLSelectElement||target?.isContentEditable)return;const item=selectedItem();if(!item)return;event.preventDefault();snap();translateItem(item,event.key==="ArrowLeft"?-4:4,0);save();renderLayers()});
function applyPrintLayout(){
  ShianPrintV2.render(state,{rootSelector:"#printRootV2",capacity:measureCapacity,measureWidth,columnX,barlineKey,pageRows:currentPageRows,meterLabel});
}
function ensurePrintLayout(){
  /* 印刷ダイアログからは通常画面の座標で既に生成済み。
     beforeprint 時に印刷CSS適用後の座標で再生成すると、書き込みだけがずれる。 */
  if(!q("#printRootV2").childElementCount)applyPrintLayout();

window.addEventListener("beforeprint",ensurePrintLayout);

  q("#printRootV2").replaceChildren();
});
window.addEventListener("resize",()=>{applyPreview()},{passive:true});
