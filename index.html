<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>絲庵 文化譜入力</title>
  <style>
    :root{--ink:#332c25;--blue:#477d91;--pale:#e9f3f5;--yellow:#f5df84;--paper:#fffef9}
    *{box-sizing:border-box}body{margin:0;background:#e5ded3;color:var(--ink);font-family:"Yu Gothic",sans-serif}
    button,input{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:14px}
    .head{display:flex;justify-content:space-between;align-items:end;gap:10px}h1{margin:0;font:600 27px serif}
    .brand{margin:0;color:var(--blue);font:13px serif;letter-spacing:.12em}.actions{display:flex;flex-wrap:wrap;gap:6px}
    .actions button,.move button,.layout-controls button{min-height:42px;border:1px solid #bcae9e;border-radius:9px;background:#fff;padding:8px 12px}
    .paper{position:relative;margin-top:12px;padding:24px 22px 34px;background:var(--paper);border:1px solid #cabfaf;box-shadow:0 8px 25px #46331d1c;overflow:hidden}
    .paper.annotating{touch-action:none}.annotation-svg{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}.paper.annotating .annotation-svg{pointer-events:auto}
    .annotation-svg text{font:600 18px "Yu Gothic",sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.annotation-svg text.annotation-text{stroke-width:5px}
    .meta{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;font:15px serif}.meta span:last-child{text-align:right}
    .meta input{border:0;border-bottom:1px dashed #aaa;background:none;text-align:center;font:28px serif;min-width:0}
    .staff{margin-top:28px}.staff-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 5px 55px;font:12px serif;color:#75695d}
    .score-wrap{display:grid;grid-template-columns:55px minmax(0,1fr)}.labels{display:grid;grid-template-rows:repeat(3,46px);font:12px/46px serif;text-align:right;padding-right:7px}
    .score-scroll{min-width:0;overflow-x:auto;overflow-y:hidden;border-block:2px solid var(--ink)}
    .score{display:flex;width:max-content;min-width:100%}.measure{display:grid;grid-template-rows:repeat(3,46px);flex:1 0 var(--measure-width,180px);border-left:1.5px solid var(--ink);position:relative}
    .measure:last-child{border-right:2px solid var(--ink)}.measure.on{background:#fff9dd}.string{display:grid;grid-template-columns:repeat(16,minmax(32px,1fr));position:relative}
    .string::before{content:"";position:absolute;z-index:0;left:0;right:0;top:50%;border-top:1px solid var(--ink);pointer-events:none}
    .cell{border:0;background:none;padding:0;min-width:0}.cell:nth-child(4n){border-right:1px solid #477d9120}.cell.cursor{background:var(--yellow);box-shadow:inset 0 0 0 2px #c9a927}
    .note{z-index:2;align-self:center;height:40px;border:0;background:none;padding:0 4px;cursor:pointer;overflow:visible}.note b{display:inline-block;min-width:20px;background:var(--paper);padding:0 2px 2px;font:600 25px/30px Arial;white-space:nowrap}
    .measure.on .note b{background:#fff9dd}.d2 b{border-bottom:2px solid}.d1 b{border-bottom:5px double}.note.rest b{font-family:Arial,sans-serif}.note.rest.d4 b{font-size:31px}.note.rest.d2 b,.note.rest.d1 b{font-size:23px}
    .panel{margin-top:14px;padding:16px;background:#fffcf7;border:1px solid #c9bcad;border-radius:15px}.layout-bar{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #ddd2c5}
    .layout-controls{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.layout-controls strong{min-width:82px;text-align:center}.layout-controls button[aria-label]{width:42px;padding:6px;font-size:20px}
    .status{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pale);padding:10px;border-radius:10px}.status strong{display:block;color:#285366}
    .move{display:flex;gap:5px}.move .del{color:#9d4036}.controls{display:grid;grid-template-columns:1fr 1.3fr;gap:14px;margin-top:14px}fieldset{border:0;padding:0;margin:0}legend{font-size:13px;font-weight:bold;color:#74695e;margin-bottom:7px}
    .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg button{min-height:54px;border:1px solid #c7b9aa;border-radius:9px;background:white}.seg button.on{background:var(--blue);color:white;border-color:var(--blue)}.seg small{display:block;font-size:10px}
    .nums{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}.nums button,.rests button{min-height:48px;background:white;border:1px solid #cbbfb2;border-radius:9px;font-size:18px;font-weight:bold}.nums button:active,.rests button:active{background:#fff2ac}
    .rests{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.rests button{font-size:15px}.rests .mark{display:block;font:24px/1.1 Arial,sans-serif}.rests button[data-rest="4"] .mark{font-size:31px}.rests button[data-rest="2"] .mark,.rests button[data-rest="1"] .mark{font-size:23px}
    .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#766b60}.clear{border:1px solid #d1aaa1;border-radius:9px;background:#fff;color:#9d4036;padding:9px}
    .layer-panel{margin-top:12px;padding:14px;background:#f8f3eb;border:1px solid #c9bcad;border-radius:15px}.layer-top,.layer-switches,.draw-tools,.colors{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.layer-top{justify-content:space-between}
    .layer-switches{margin-top:10px}.layer-chip,.draw-tools button,.layer-top button{min-height:42px;border:1px solid #bcae9e;border-radius:9px;background:#fff;padding:7px 11px}.layer-chip.on,.draw-tools button.on{background:#477d91;color:#fff;border-color:#477d91}.layer-chip.hidden{text-decoration:line-through;opacity:.58}.layer-chip small{display:block;font-size:10px}
    .draw-tools{margin-top:12px;padding-top:12px;border-top:1px solid #ddd2c5}.colors{margin-left:auto}.color{width:38px;height:38px!important;min-height:38px!important;border-radius:50%!important;padding:0!important;background:var(--c)!important}.color.on{outline:3px solid #fff;box-shadow:0 0 0 3px #477d91}.layer-help{margin:8px 0 0;font-size:12px;color:#75695d}
    dialog{width:min(92vw,480px);border:1px solid #bbaea0;border-radius:16px;padding:0;box-shadow:0 18px 50px #0005}dialog::backdrop{background:#332c2588}
    .dialog-body{padding:22px}.dialog-body h2{margin:0 0 8px;font:600 24px serif}.dialog-body p{margin:0 0 18px;color:#6d6257}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-grid label{font-size:13px;font-weight:bold}.form-grid input{width:100%;margin-top:6px;padding:11px;border:1px solid #bcae9e;border-radius:9px;font-size:18px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .dialog-actions button{min-height:44px;padding:9px 18px;border:1px solid #bcae9e;border-radius:9px;background:#fff}.dialog-actions .primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    @media(max-width:650px){.app{padding:9px}.head{align-items:start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.paper{padding:17px 8px 24px}.meta{grid-template-columns:1fr;gap:5px;text-align:center}.meta span:last-child{text-align:center}.meta input{font-size:24px}.staff{margin-top:22px}.score-wrap{grid-template-columns:42px minmax(0,1fr)}.staff-head{margin-left:42px}.labels{padding-right:4px;font-size:11px}.panel{padding:12px}.layout-bar,.status{align-items:stretch;flex-direction:column}.layout-controls{justify-content:center}.controls{grid-template-columns:1fr}.nums{grid-template-columns:repeat(5,1fr)}.nums button{min-height:54px}.rests{grid-template-columns:repeat(2,1fr)}.bottom{align-items:stretch;flex-direction:column;gap:8px}.form-grid{grid-template-columns:1fr}.colors{margin-left:0}.draw-tools button{flex:1 0 28%}}
    @media print{body{background:#fff}.app{max-width:none;padding:0}.head,.panel{display:none}.paper{border:0;box-shadow:none;margin:0;padding:8mm}.score-scroll{overflow:visible}.score{width:100%}.measure{min-width:0!important;flex:1 1 auto}.staff{break-inside:avoid}.meta{grid-template-columns:1fr 2fr 1fr}}
  </style>
</head>
<body>
<main class="app">
  <header class="head"><div><p class="brand">絲庵 ─ Shian ─</p><h1>文化譜入力</h1></div><div class="actions"><button id="newScore">＋ 新規作成</button><button id="undo">↶ 戻す</button><button id="redo">↷ やり直す</button></div></header>
  <section class="paper">
    <div class="meta"><span>〈二上り〉 四分ノ二拍子</span><input id="title" value="曲名入力" aria-label="曲名"><span id="summary"></span></div>
    <div id="scoreArea"></div>
    <svg id="annotations" class="annotation-svg" aria-label="書き込みレイヤー"></svg>
  </section>
  <section class="layer-panel">
    <div class="layer-top"><strong>個人書き込みレイヤー</strong><div><button id="toggleDrawing">✎ 描画を開始</button><button id="addLayer">＋ レイヤー</button><button id="deleteLayer">削除</button></div></div>
    <div id="layerSwitches" class="layer-switches"></div>
    <div id="drawTools" class="draw-tools">
      <button data-tool="pen">自由線</button><button data-tool="arrow">矢印</button><button data-tool="rect">枠</button><button data-tool="text">コメント</button><button data-tool="eraser">消しゴム</button>
      <div id="colors" class="colors"></div>
    </div>
    <p id="layerHelp" class="layer-help">「描画を開始」を押すと、選択中の個人レイヤーへ書き込めます。</p>
  </section>
  <section class="panel">
    <div class="layout-bar">
      <div class="layout-controls"><span>段数</span><button id="removeRow" aria-label="段を減らす">−</button><strong id="rowCount"></strong><button id="addRow" aria-label="段を増やす">＋</button></div>
      <div class="layout-controls"><span>1段の小節数</span><button id="removeMeasure" aria-label="小節を減らす">−</button><strong id="measureCount"></strong><button id="addMeasure" aria-label="小節を増やす">＋</button></div>
    </div>
    <div class="status"><div><small>現在の入力位置</small><strong id="status"></strong></div><div class="move"><button id="prev">←</button><button id="next">→</button><button id="delete" class="del">この音を削除</button></div></div>
    <div class="controls">
      <fieldset><legend>1. 糸を選ぶ</legend><div id="strings" class="seg"></div></fieldset>
      <fieldset><legend>2. 音の長さ</legend><div id="durations" class="seg"></div></fieldset>
    </div>
    <fieldset style="margin-top:14px"><legend>3. 数字・開放弦・休符を入れる</legend><div id="numbers" class="nums"></div><div id="rests" class="rests"></div></fieldset>
    <div class="bottom"><span>入力内容はこの端末に自動保存されます。</span><button id="clear" class="clear">譜面を空にする</button></div>
  </section>
</main>
<dialog id="newDialog">
  <form id="newForm" class="dialog-body">
    <h2>新しい文化譜を作る</h2>
    <p>段数と、1段に入れる小節数を指定してください。</p>
    <div class="form-grid">
      <label>段数<input id="initialRows" type="number" inputmode="numeric" min="1" max="20" value="1" required></label>
      <label>1段の小節数<input id="initialMeasures" type="number" inputmode="numeric" min="1" max="12" value="4" required></label>
    </div>
    <div class="dialog-actions"><button type="button" id="cancelNew">取消</button><button type="submit" class="primary">この設定で作成</button></div>
  </form>
</dialog>
<script>
(()=>{"use strict";
const KEY="shian-bunkafu-editor-v2",OLD_KEY="shian-bunkafu-one-line-v1",vals=Array.from({length:20},(_,i)=>String(i+1));
const rests=[{d:4,label:"4分休符",mark:"●"},{d:2,label:"8分休符",mark:"●"},{d:1,label:"16分休符",mark:"●"}];
const colors=["#d63c32","#2474c6","#208750","#8b48a5","#e58b17","#222222"];
const defaults={notes:[],title:"曲名入力",rows:1,measuresPerRow:4,m:0,s:1,p:0,d:4,layers:[],activeLayerId:null,drawTool:"pen",drawColor:colors[0]};
let state={...defaults},past=[],future=[],hasSaved=false;
let drawing=false,draft=null;
const q=x=>document.querySelector(x),clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
function load(){
  try{
    const current=JSON.parse(localStorage.getItem(KEY));
    if(current&&Array.isArray(current.notes)){state={...defaults,...current};hasSaved=true;return}
    const old=JSON.parse(localStorage.getItem(OLD_KEY));
    if(old&&Array.isArray(old.notes)){state={...defaults,notes:old.notes.map(n=>n.v==="0"?{...n,v:"○"}:n),title:old.title||defaults.title};hasSaved=true}
  }catch(error){console.warn("保存データを読み込めませんでした。",error)}
}
function serializable(){return{notes:state.notes,title:state.title,rows:state.rows,measuresPerRow:state.measuresPerRow,m:state.m,s:state.s,p:state.p,d:state.d,layers:state.layers,activeLayerId:state.activeLayerId,drawTool:state.drawTool,drawColor:state.drawColor}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(serializable()));hasSaved=true}catch(error){console.warn("自動保存できませんでした。",error)}}
function snap(){past.push(JSON.stringify(serializable()));if(past.length>50)past.shift();future=[]}
function totalMeasures(){return state.rows*state.measuresPerRow}
function measureWidth(m){
  const notes=state.notes.filter(n=>n.m===m);
  const widest=notes.reduce((max,n)=>Math.max(max,String(n.v||"").length),1);
  const perString=Math.max(0,...[1,2,3].map(s=>notes.filter(n=>n.s===s).reduce((sum,n)=>sum+(n.d===1?1:n.d===2?.55:.3),0)));
  return Math.max(180,Math.ceil(perString*31+widest*8));
}
function noteHtml(n,m,s){
  const value=n.rest?(rests.find(r=>r.d===n.d)||rests[0]).mark:n.v;
  return `<button class="note d${n.d}${n.rest?" rest":""}" style="grid-column:${n.p+1}/span ${n.d}" data-pos="${m},${s},${n.p}" aria-label="${n.rest?"休符":value}"><b>${value}</b></button>`;
}
function measureHtml(m){
  return `<div class="measure ${m===state.m?"on":""}" style="--measure-width:${measureWidth(m)}px">${[3,2,1].map(s=>`<div class="string">${Array.from({length:16},(_,p)=>`<button class="cell ${m===state.m&&s===state.s&&p===state.p?"cursor":""}" data-pos="${m},${s},${p}" aria-label="${m+1}小節 ${p+1}位置"></button>`).join("")}${state.notes.filter(n=>n.m===m&&n.s===s).map(n=>noteHtml(n,m,s)).join("")}</div>`).join("")}</div>`;
}
function render(){
  const total=totalMeasures();state.m=clamp(state.m,0,total-1);state.p=clamp(state.p,0,15);
  q("#title").value=state.title;q("#summary").textContent=`${state.rows}段・1段${state.measuresPerRow}小節`;
  q("#rowCount").textContent=`${state.rows}段`;q("#measureCount").textContent=`${state.measuresPerRow}小節`;
  const row=Math.floor(state.m/state.measuresPerRow);
  q("#status").textContent=`${row+1}段・${state.m%state.measuresPerRow+1}小節・${["","一","二","三"][state.s]}の糸・${Math.floor(state.p/4)+1}拍目`;
  q("#strings").innerHTML=[3,2,1].map(s=>`<button class="${s===state.s?"on":""}" data-s="${s}">${["","一","二","三"][s]}の糸</button>`).join("");
  q("#durations").innerHTML=[[4,"4分","下線なし"],[2,"8分","下線1本"],[1,"16分","下線2本"]].map(x=>`<button class="${x[0]===state.d?"on":""}" data-d="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join("");
  q("#numbers").innerHTML=vals.map(v=>`<button data-v="${v}">${v}</button>`).join("");
  q("#rests").innerHTML=`<button data-v="○"><span class="mark">○</span>開放弦</button>`+rests.map(r=>`<button data-rest="${r.d}"><span class="mark">${r.mark}</span>${r.label}</button>`).join("");
  q("#scoreArea").innerHTML=Array.from({length:state.rows},(_,r)=>`<section class="staff"><div class="staff-head"><span>${r+1}段目</span><span>${state.measuresPerRow}小節</span></div><div class="score-wrap"><div class="labels"><span>三の糸</span><span>二の糸</span><span>一の糸</span></div><div class="score-scroll"><div class="score">${Array.from({length:state.measuresPerRow},(_,i)=>measureHtml(r*state.measuresPerRow+i)).join("")}</div></div></div></section>`).join("");
  q("#undo").disabled=!past.length;q("#redo").disabled=!future.length;
  q("#removeRow").disabled=state.rows<=1;q("#removeMeasure").disabled=state.measuresPerRow<=1;save();
  renderLayers();
}
function activeLayer(){return state.layers.find(layer=>layer.id===state.activeLayerId)||null}
function uid(){return globalThis.crypto&&typeof globalThis.crypto.randomUUID==="function"?globalThis.crypto.randomUUID():`item-${Date.now()}-${Math.random().toString(36).slice(2)}`}
function esc(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
function pointsAttr(points){return points.map(point=>`${point.x},${point.y}`).join(" ")}
function itemHtml(item){
  const common=`data-item="${item.id}" stroke="${item.color}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"`;
  if(item.type==="pen")return `<polyline ${common} points="${pointsAttr(item.points)}"/>`;
  if(item.type==="rect")return `<rect ${common} x="${Math.min(item.x1,item.x2)}" y="${Math.min(item.y1,item.y2)}" width="${Math.abs(item.x2-item.x1)}" height="${Math.abs(item.y2-item.y1)}" rx="5"/>`;
  if(item.type==="arrow"){
    const dx=item.x2-item.x1,dy=item.y2-item.y1,a=Math.atan2(dy,dx),size=16;
    const p1={x:item.x2-size*Math.cos(a-.55),y:item.y2-size*Math.sin(a-.55)},p2={x:item.x2-size*Math.cos(a+.55),y:item.y2-size*Math.sin(a+.55)};
    return `<g data-item="${item.id}"><line ${common} x1="${item.x1}" y1="${item.y1}" x2="${item.x2}" y2="${item.y2}"/><polyline ${common} points="${p1.x},${p1.y} ${item.x2},${item.y2} ${p2.x},${p2.y}"/></g>`;
  }
  return `<text data-item="${item.id}" class="annotation-text" x="${item.x}" y="${item.y}" fill="${item.color}">${esc(item.text)}</text>`;
}
function renderLayers(){
  if(!Array.isArray(state.layers))state.layers=[];
  const svg=q("#annotations"),paper=q(".paper");
  svg.setAttribute("viewBox","0 0 1000 1000");svg.setAttribute("preserveAspectRatio","none");
  svg.innerHTML=state.layers.filter(layer=>layer.visible!==false).map(layer=>`<g data-layer="${layer.id}">${layer.items.map(itemHtml).join("")}</g>`).join("");
  q("#layerSwitches").innerHTML=state.layers.length?state.layers.map(layer=>`<button class="layer-chip ${layer.id===state.activeLayerId?"on":""} ${layer.visible===false?"hidden":""}" data-layer="${layer.id}">${esc(layer.name)}<small>${layer.visible===false?"非表示":"表示中"}・${layer.items.length}件</small></button>`).join(""):"<span>レイヤーはまだありません</span>";
  q("#drawTools").querySelectorAll("[data-tool]").forEach(button=>button.classList.toggle("on",button.dataset.tool===state.drawTool));
  q("#colors").innerHTML=colors.map(color=>`<button class="color ${color===state.drawColor?"on":""}" style="--c:${color}" data-color="${color}" aria-label="${color}"></button>`).join("");
  paper.classList.toggle("annotating",drawing);
  q("#toggleDrawing").textContent=drawing?"✓ 描画を終了":"✎ 描画を開始";
  const layer=activeLayer();q("#layerHelp").textContent=drawing?(layer?`「${layer.name}」へ書き込み中。譜面上を操作してください。`:"先に個人レイヤーを作成してください。"):"レイヤーボタンを短く押すと切替、同じボタンを長押しすると表示・非表示を切り替えます。";
  save();
}
function pointFromEvent(event){const rect=q("#annotations").getBoundingClientRect();return{x:(event.clientX-rect.left)*q("#annotations").viewBox.baseVal.width/rect.width,y:(event.clientY-rect.top)*q("#annotations").viewBox.baseVal.height/rect.height}}
function addLayer(){
  const name=prompt("この書き込みレイヤーを使う人の名前を入力してください。","");
  if(!name||!name.trim())return;
  snap();const id=`layer-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;state.layers.push({id,name:name.trim(),visible:true,items:[]});state.activeLayerId=id;render();
}
function startDraw(event){
  if(!drawing)return;const layer=activeLayer();if(!layer){addLayer();return}
  const p=pointFromEvent(event);
  if(state.drawTool==="text"){const text=prompt("譜面に入れるコメントを入力してください。","");if(text&&text.trim()){snap();layer.items.push({id:uid(),type:"text",x:p.x,y:p.y,text:text.trim(),color:state.drawColor});render()}return}
  if(state.drawTool==="eraser"){const target=event.target.closest("[data-item]");if(target){snap();layer.items=layer.items.filter(item=>item.id!==target.dataset.item);render()}return}
  event.preventDefault();q("#annotations").setPointerCapture(event.pointerId);draft={type:state.drawTool,start:p,points:[p]};
}
function moveDraw(event){if(!draft)return;event.preventDefault();const p=pointFromEvent(event);if(draft.type==="pen")draft.points.push(p);else draft.end=p}
function endDraw(event){
  if(!draft)return;const layer=activeLayer(),end=draft.end||pointFromEvent(event);snap();
  if(draft.type==="pen"&&draft.points.length>1)layer.items.push({id:uid(),type:"pen",points:draft.points,color:state.drawColor});
  else if(draft.type==="rect"&&Math.hypot(end.x-draft.start.x,end.y-draft.start.y)>5)layer.items.push({id:uid(),type:"rect",x1:draft.start.x,y1:draft.start.y,x2:end.x,y2:end.y,color:state.drawColor});
  else if(draft.type==="arrow"&&Math.hypot(end.x-draft.start.x,end.y-draft.start.y)>5)layer.items.push({id:uid(),type:"arrow",x1:draft.start.x,y1:draft.start.y,x2:end.x,y2:end.y,color:state.drawColor});
  else past.pop();
  draft=null;render();
}
function changeLayout(rows,measures){
  rows=clamp(Number(rows)||1,1,20);measures=clamp(Number(measures)||1,1,12);
  const newTotal=rows*measures,discard=state.notes.some(n=>n.m>=newTotal);
  if(discard&&!confirm("減らした範囲に入力済みの音があります。その音を削除して変更しますか？"))return false;
  snap();state.rows=rows;state.measuresPerRow=measures;state.notes=state.notes.filter(n=>n.m<newTotal);state.m=clamp(state.m,0,newTotal-1);render();return true;
}
function insert(value,isRest=false,duration=state.d){
  snap();const d=Math.min(duration,16-state.p);
  state.notes=state.notes.filter(n=>!(n.m===state.m&&n.s===state.s&&n.p===state.p));
  state.notes.push(isRest?{m:state.m,s:state.s,p:state.p,d,rest:true}:{m:state.m,s:state.s,p:state.p,d,v:value});
  const np=state.p+d;if(np<16)state.p=np;else if(state.m<totalMeasures()-1){state.m++;state.p=0}
}
function openNew(){
  q("#initialRows").value=state.rows;q("#initialMeasures").value=state.measuresPerRow;
  if(typeof q("#newDialog").showModal==="function")q("#newDialog").showModal();else q("#newDialog").setAttribute("open","");
}
load();
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.s)state.s=+b.dataset.s;
  else if(b.dataset.d)state.d=+b.dataset.d;
  else if(b.dataset.pos)[state.m,state.s,state.p]=b.dataset.pos.split(",").map(Number);
  else if(b.dataset.v){insert(b.dataset.v)}
  else if(b.dataset.rest){insert("",true,+b.dataset.rest)}
  else if(b.id==="prev"){if(state.p>0)state.p--;else if(state.m>0){state.m--;state.p=15}}
  else if(b.id==="next"){if(state.p<15)state.p++;else if(state.m<totalMeasures()-1){state.m++;state.p=0}}
  else if(b.id==="delete"){const len=state.notes.length;snap();state.notes=state.notes.filter(n=>!(n.m===state.m&&n.s===state.s&&n.p===state.p));if(len===state.notes.length)past.pop()}
  else if(b.id==="clear"&&state.notes.length&&confirm("譜面の入力内容をすべて削除しますか？")){snap();state.notes=[];state.m=0;state.s=1;state.p=0}
  else if(b.id==="undo"&&past.length){future.unshift(JSON.stringify(serializable()));Object.assign(state,JSON.parse(past.pop()))}
  else if(b.id==="redo"&&future.length){past.push(JSON.stringify(serializable()));Object.assign(state,JSON.parse(future.shift()))}
  else if(b.id==="addRow"){changeLayout(state.rows+1,state.measuresPerRow);return}
  else if(b.id==="removeRow"){changeLayout(state.rows-1,state.measuresPerRow);return}
  else if(b.id==="addMeasure"){changeLayout(state.rows,state.measuresPerRow+1);return}
  else if(b.id==="removeMeasure"){changeLayout(state.rows,state.measuresPerRow-1);return}
  else if(b.id==="newScore"){openNew();return}
  else if(b.id==="addLayer"){addLayer();return}
  else if(b.id==="deleteLayer"){const layer=activeLayer();if(layer&&confirm(`「${layer.name}」レイヤーと書き込みを削除しますか？`)){snap();state.layers=state.layers.filter(x=>x.id!==layer.id);state.activeLayerId=state.layers[0]?.id||null;drawing=false;render()}return}
  else if(b.id==="toggleDrawing"){if(!state.layers.length){addLayer();if(!state.layers.length)return}drawing=!drawing;renderLayers();return}
  else if(b.dataset.layer){state.activeLayerId=b.dataset.layer;renderLayers();return}
  else if(b.dataset.tool){state.drawTool=b.dataset.tool;renderLayers();return}
  else if(b.dataset.color){state.drawColor=b.dataset.color;renderLayers();return}
  else if(b.id==="cancelNew"){q("#newDialog").close();return}
  render();
});
let layerPressTimer=null,longPressed=false;
q("#layerSwitches").addEventListener("pointerdown",event=>{const button=event.target.closest("[data-layer]");if(!button)return;longPressed=false;layerPressTimer=setTimeout(()=>{longPressed=true;const layer=state.layers.find(x=>x.id===button.dataset.layer);if(layer){snap();layer.visible=layer.visible===false;render()}},600)});
q("#layerSwitches").addEventListener("pointerup",()=>clearTimeout(layerPressTimer));
q("#layerSwitches").addEventListener("pointerleave",()=>clearTimeout(layerPressTimer));
q("#annotations").addEventListener("pointerdown",startDraw);
q("#annotations").addEventListener("pointermove",moveDraw);
q("#annotations").addEventListener("pointerup",endDraw);
q("#annotations").addEventListener("pointercancel",()=>{draft=null});
q("#title").addEventListener("change",e=>{snap();state.title=e.target.value;render()});
q("#newForm").addEventListener("submit",e=>{e.preventDefault();
  if((state.notes.length||state.title!=="曲名入力")&&!confirm("現在の譜面を消して、新規作成しますか？"))return;
  const rows=clamp(+q("#initialRows").value,1,20),measures=clamp(+q("#initialMeasures").value,1,12);
  snap();state={...defaults,rows,measuresPerRow:measures};q("#newDialog").close();render();
});
render();if(!hasSaved)openNew();
})();
</script>
</body>
</html>
