<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4eee4">
  <title>文化譜プレーヤー｜絲庵</title>
  <style>
    :root{color-scheme:light;--ink:#332a23;--brown:#765744;--gold:#c7a84c;--paper:#fffdf8;--bg:#f4eee4}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
    body{display:grid;place-items:center;padding:14px}.player{width:min(100%,410px);padding:16px;border:1px solid #d5c5b4;border-radius:20px;background:var(--paper);box-shadow:0 8px 24px #4a35251c}
    .brand{margin:0 0 10px;text-align:center;color:var(--brown);font:600 14px serif;letter-spacing:.08em}.counts{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.counts button,.transport button,.tempo button{border:1px solid #c9b9a7;background:#fff;color:var(--ink);font:700 16px/1 sans-serif;border-radius:10px;min-height:42px;touch-action:manipulation}.counts button.on{border-color:var(--gold);background:#f1df9b;box-shadow:inset 0 0 0 1px #b99836}
    .tempo{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-top:14px}.tempo input{width:100%;accent-color:var(--brown)}.tempo-value{grid-column:1/-1;text-align:center;font-size:13px;color:#6d6259}.transport{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.transport button{min-height:54px;font-size:24px}.transport button.primary{background:var(--brown);border-color:var(--brown);color:#fff}.transport button.muted{color:#9b3028;background:#fff2f0}.status{min-height:22px;margin:12px 0 0;text-align:center;font-size:13px;color:#675b51}.status.error{color:#a12f25}
    @media(max-width:360px){body{padding:8px}.player{padding:12px}.counts{gap:3px}.counts button{font-size:14px;min-height:40px}.transport{gap:7px}}
  </style>
</head>
<body>
  <main class="player" aria-label="文化譜プレーヤー">
    <p class="brand">絲庵 ─ 文化譜プレーヤー ─</p>
    <div class="counts" aria-label="本数選択"></div>
    <div class="tempo">
      <button id="tempoDown" type="button" aria-label="テンポを下げる">−</button>
      <input id="tempo" type="range" min="40" max="180" step="1" value="96" aria-label="テンポ">
      <button id="tempoUp" type="button" aria-label="テンポを上げる">＋</button>
      <div id="tempoValue" class="tempo-value">96 BPM</div>
    </div>
    <div class="transport">
      <button id="rewind" type="button" aria-label="先頭へ戻る">↶</button>
      <button id="playPause" class="primary" type="button" aria-label="再生">▶</button>
      <button id="mute" type="button" aria-label="音を消す">♪</button>
    </div>
    <p id="status" class="status" role="status">文化譜から演奏データを受信します。</p>
  </main>
  <script src="./player.js"></script>
</body>
</html>
